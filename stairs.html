<!DOCTYPE html>
<html lang="en">
  <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  </head>

  <body>

<style>

    body, html {
    margin: 0;
            padding: 0;
            height: 100%;
            background-color: blue;
    }

.stairway{
    display: flex;
       position: relative;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100vh;
}

#text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    font-size: 35px;
    text-align: center;
}

#return {
    position: absolute;
    top: 65%;
    left: 50%;
    transform: translate(-50%, -50%);
}

#returnButton {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 20px;
    cursor: pointer;
    background-color: transparent;
    border: 2px dotted white;
    color: white;
    padding: 10px 20px;
    display: none;
}

</style>

<div id = "text">
</div>

<div id = "return">
  <button id = "returnButton" onclick = "goBack()">go back downstairs</button>
</div>

<script>

var i = 0;
var txt = "this is not the way to the party, dumbass."; 
var speed = 80;

function typeWriter() {
    if (i < txt.length) {
      document.getElementById("text").innerHTML += txt.charAt(i);
      i++;
      setTimeout(typeWriter, speed);
     } 
    }

window.onload = function() {
  typeWriter()
  setTimeout(function() {
    document.getElementById("returnButton").style.display = "block";
  }, 5000);
}

function goBack() {
  window.location.href = "entrance.html";
}
</script>


</body>
</html>
