function playFinalAudio() {
  const finalAudio = document.getElementById("finalAudio");
  finalAudio.volume = 0; // Start silent
  finalAudio.loop = true;
  finalAudio.play();
  
  // Fade in over 3 seconds
  let currentVolume = 0;
  const fadeInterval = setInterval(function() {
    currentVolume += 0.02; 
    if (currentVolume >= 1) {
      currentVolume = 1;
      clearInterval(fadeInterval);
    }
    finalAudio.volume = currentVolume;
  }, 100); // Update every 100ms
}

function fadeOutBattleAudio() {
  const battleAudio = document.getElementById("battleAudio");
  let currentVolume = battleAudio.volume;
  
  // Fade out over 3 seconds
  const fadeInterval = setInterval(function() {
    currentVolume -= 0.04; 
    if (currentVolume <= 0) {
      currentVolume = 0;
      battleAudio.volume = 0;
      battleAudio.pause();
      clearInterval(fadeInterval);
    } else {
      battleAudio.volume = currentVolume;
    }
  }, 100); // Update every 100ms
}
