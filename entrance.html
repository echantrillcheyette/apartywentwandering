<!DOCTYPE html>
<html lang="en">
  <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  </head>

  <body>

<style>

    body, html {
    margin: 0;
            padding: 0;
            height: 100%;
    }

.entrance {
    display: flex;
       position: relative;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100vh;
}

#stairs {
  position: absolute;
    left: 20%;
}

#door, #door2 {
    position: absolute;
    left: 50%;
    z-index: 1;
  position: absolute;
    left: 60%;
}

#door2 {
    display: none;
    pointer-events: none;
}

#door:hover + #door2 {
    display: block;
}

#bunting {
    position: absolute;
        left: 56%;
        top: 14%;
        z-index: 1;
}

#plant {
    position: absolute;
    left: 8%;
    top: 37%;
    z-index: 1;
}

#stool {
    position: absolute;
    left: 10%;
    top: 60%;
}

      #text {
        font-family:'Courier New', Courier, monospace;
        color: black;
        margin-top: 20px;
        text-align: center;
        z-index: 10;
        position: absolute;
        top: 85%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 18px;
    }

    #hoverStairs {
        font-family: Arial, Helvetica, sans-serif;
  position: absolute;
display: none;
border: 1px solid black;
  background: white;
    width: 150px;
    height: 50px;
    top: 20%;
    left: 15%;
    z-index: 10;
    padding: 10px;
    }

     #hoverDoor {
        font-family: Arial, Helvetica, sans-serif;
  position: absolute;
display: none;
border: 1px solid black;
  background: white;
    width: 200px;
    height: 70px;
    top: 20%;
    left: 70%;
    z-index: 10;
    padding: 10px;
    }

     #objective {
        display: none;
        font-family:'Courier New', Courier, monospace;
        color: black;
        border: 1px solid black;
        padding: 5px;
        text-align: center;
        z-index: 10;
        position: absolute;
        top: 5%;
        left: 5%;
        font-size: 16px;
    }

    </style>

   <audio id = "backgroundMusic" autoplay loop>
  <source src="partytheme2(amplified).mp3" type="audio/mpeg">
</audio>

<div class = "entrance">

<div id = "stairs">
      <span id = "one" onmouseover = "oneBox()" onmouseout="hideBox()">
        <a href = "stairs.html">
    <img src = "stairs(noshade).png" width = "400px" height = "auto">
    </a>
    </span>
</div>

<div id = "door">
    <span id = "two">
        <a href = "livingroom.html" onmouseenter = "twoBox()" onmouseleave="hideBox2()">
    <img src = "doorway.png" width = "175px" height = "auto">
    </a>
    </span>
</div>

<div id = "door2">
    <img src = "doorway(busy).png" width = "175px" height = "auto">
</div>

<div id = "hoverStairs">
    A stairway leading somewhere...
</div>

<div id = "hoverDoor">
You can hear the buzz of music and chatter coming from the door.
</div>

<div id = "bunting">
    <img src = "bunting31.png" width = "275px" height = "auto">
    </div>

    <div id = "plant">
    <img src = "plant.png" width = "200px" height = "auto">
    </div>

<div id = "stool">
    <img src = "stool.png" width = "150px" height = "auto">
    </div>
</div>

</div>

<div id = "text"></div>

 <div id = "objective">
      current objective: find the party
    </div>


<script>
    window.onload = function() {
  typeWriter();
};

  var i = 0;
  var txt = ">You enter the house. You find yourself in a hallway."; 
  var speed = 80;

  function typeWriter() {
    if (i < txt.length) {
      document.getElementById("text").innerHTML += txt.charAt(i);
      i++;
      setTimeout(typeWriter, speed);
     } 
    }

     function oneBox() {
    document.getElementById("hoverStairs").style.display = "block";
  }

  function hideBox() {
    document.getElementById("hoverStairs").style.display = "none";
  }

  function twoBox() {
    document.getElementById("hoverDoor").style.display = "block";
  }

    function hideBox2() {
    document.getElementById("hoverDoor").style.display = "none";
  }

  setTimeout (function() {
    document.getElementById('objective').style.display = 'block';
  }, 8000);

</script>

    </body>
    </html>
