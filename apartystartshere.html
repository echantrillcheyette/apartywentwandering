<!DOCTYPE html>
<html lang="en">
  <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  </head>

  <body>

<style>

    body, html {
    background-color: black;
    margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    }

      #textContainer {
        font-family:'Courier New', Courier, monospace;
        margin: 100px;
    }

       .scene {
        display: flex;
          justify-content: center;
        }


          #knock {
            position: absolute;
            margin-top: 50px;
            top: 15%;
        }

          #knockText {
            font-family:'Courier New', Courier, monospace;
            color: white;
            display: none;
            margin-top: 40px;
            font-size: 20px;
        }

        #doorImg {
            cursor: pointer;
            width: 200px;
             height: auto;
        }

        #bunting img {
            position: absolute;
            top: 10%;
            left: 36%;
            width: 350px;
            height: auto;
            z-index: 1000;
        }

        #speechBubble {
            position: absolute;
            top: 30%;
            left: 65%;
            transform: translate(-50%, -50%);
            display: none;
        }

        #speechText {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'arial', Helvetica, sans-serif;
            color: black;
            font-size: 20px;
            text-align: center;
        }
    </style>

<div class = "scene">

     <audio id = "backgroundMusic" autoplay loop>
</audio>

    <audio id = "knockSound" src="knock.mp3"></audio>

    <audio id = "comeInSound" src="select3.wav"></audio>

    <div id = "bunting">
        <img src = "bunting31.png">
    </div>

    <div id = "knock"> 
        <img id = "doorImg" src = "door(white).png" onclick = "handleDoorClick();">
    </div>

    <div id = "knockText">*knock knock*</div>


  <!-- <div id = "door">
     <a href = "entrance.html">
    <img src = "door2.png">
    </a>

-->

<div id = "speechBubble">
    <img src = "speechbubble.png" style = "width: 200px; height: auto;">
    <div id = "speechText">come in!</div>
 
  </div>
</div>

<script>
    var knockCount = 0;
    var doorLinkActive = false;
    var bubbleVisible = false;

function playKnock() {
  var knockSound = document.getElementById("knockSound");
  knockSound.play();
}

function handleDoorClick() {
  if (doorLinkActive) {
    window.location.href = "entrance.html";
    return;
  }

  if (bubbleVisible) {
    return;
  }

  knockCount++;
  playKnock();
  showText();

  if (knockCount === 3) {
    bubbleVisible = true;
    setTimeout(function() {
      document.getElementById("speechBubble").style.display = "block";
       var selectAudio = document.getElementById("comeInSound");
  if (selectAudio) {
    selectAudio.currentTime = 0;
    selectAudio.play();
      }
    }, 1500);
    setTimeout(function() {
      document.getElementById("speechBubble").style.display = "none";
      bubbleVisible = false;
      doorLinkActive = true;
    }, 4000);
  }
}

function showText() {
  var knockText = document.getElementById("knockText");
  knockText.style.display = "block";
  setTimeout (function() {
    knockText.style.display = "none";
  }, 1000);
}

</script>


    </body>
    
    </html>
