<script>
  var i = 0;
  var txt = "Something appears in front of you, materialising as if loading in."; /* The text */
  var speed = 75;

var j = 0;
    var txt2 = "A kind of road stretches as far as the eye can see."; 
    var speed2 = 75;

  function typeWriter() {
    if (i < txt.length) {
      document.getElementById("text").innerHTML += txt.charAt(i);
      i++;
      setTimeout(typeWriter, speed);
     } else {
          // When first message is done, start second
          setTimeout(typeWriter2, 500); 
        }
      }

function typeWriter2() {
      if (j < txt2.length) {
        document.getElementById("text2").innerHTML += txt2.charAt(j);
        j++;
        setTimeout(typeWriter2, speed2);
      } 
    }
  setTimeout (function() {
    window.onload = typeWriter();
  }, 2000);
 
  function showContinue() {
    document.getElementById("continue").style.display = "block";
  }

  setTimeout (function() {
    window.onload = showContinue();
  }, 15000);
  
function oneBox() {
    document.getElementById("hoverScene1").style.display = "block";
  }

  function hideBox() {
    document.getElementById("hoverScene1").style.display = "none";
  }

</script>
